[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litsearch"
version = "0.1.0"
description = "Literature Relationship Network Explorer with MCP integration"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "requests>=2.28",
    "streamlit>=1.50",
    "matplotlib>=3.7",
    "pyvis>=0.3",
    "scikit-learn>=1.3",
    "fastmcp>=3.0",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
litsearch-mcp = "litsearch.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
